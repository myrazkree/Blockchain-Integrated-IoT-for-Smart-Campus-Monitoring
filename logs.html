<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Logs</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d1425;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .top-nav {
            background-color: #0d1425;
            padding: 15px;
            border-bottom: 2px solid #38bdf8;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap; /* Allows nav buttons to wrap on narrow devices */
        }
        .nav-link { color: #38bdf8; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }
        .logout-btn { color: #ef4444; cursor: pointer; border: 1px solid #ef4444; padding: 5px 12px; border-radius: 5px; font-size: 0.8rem; }

        h2 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            margin: 20px 10px;
        }

        /* 2. ADDED: This container handles smooth scrolling on mobile phones */
        .table-container {
            width: 95%;
            max-width: 1100px;
            margin: 20px auto;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 5px;
            box-sizing: border-box;
            overflow-x: auto; /* Adds isolated side-scrolling if the screen is too narrow */
        }

        /* CHANGED: Made the layout fluid within its parent block */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            min-width: 650px; /* Guarantees data columns stay neat and highly readable */
        }
        th, td {
            padding: 12px 10px;
            border: 1px solid #334155;
            text-align: left;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem); /* Dynamic text scaling */
            word-break: break-all; /* Stops long hashes from pushing elements off layout boundaries */
        }
        th { color: #38bdf8; background: #0f172a; }
        tr:hover { background-color: #243147; }

        /* Status Integrity Styling Tags */
        .status-tag {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .status-valid { color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .status-broken { color: #ef4444; background: rgba(239, 68, 68, 0.1); animation: flash 1s infinite; }
        .status-invalid { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }

        @keyframes flash {
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/logs" class="nav-link" style="color:white; border-bottom: 2px solid #38bdf8;">View Logs</a>
        <span class="logout-btn" onclick="logout()">LOGOUT</span>
    </nav>

    <h2>Campus Blockchain Ledger</h2>

    <div class="table-container">
        <table id="logTable">
            <thead>
                <tr>
                    <th style="width: 10%;">Block #</th>
                    <th style="width: 10%;">Sensor ID</th>
                    <th style="width: 13%;">Type</th>
                    <th style="width: 9%;">Value</th>
                    <th style="width: 11%;">Status</th>
                    <th style="width: 15%;">Alert ID</th>
                    <th style="width: 21%;">Hash</th>
                    <th style="width: 15%;">Integrity</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
    window.onload = () => {
        if (localStorage.getItem("logged") !== "true") {
            window.location.href = "/";
        } else {
            loadLogs();
            setInterval(loadLogs, 5000);
        }
    };

    function logout() {
        localStorage.removeItem("logged");
        window.location.href = "/";
    }

    async function loadLogs() {
        try {
            const res = await fetch("/chain");
            const data = await res.json();
            const tbody = document.querySelector("#logTable tbody");

            tbody.innerHTML = "";

            data.chain.reverse().forEach(b => {
                const row = document.createElement('tr');

                // FIXED: Handles Genesis Block structural output using the corrected hash key
                if (b.index === 0) {
                    const genesisHash = b.hash || "B2282d6c00dc5a4319b71f71723c748d6bbc14fb1c3a10cf8fca25510051";
                    row.innerHTML = `
                        <td><strong>#${b.index}</strong></td>
                        <td colspan="5" style="text-align:center; color:#64748b; font-style: italic;">${b.data}</td>
                        <td style="font-family:monospace; font-size:0.75rem; color:#64748b" title="${genesisHash}">
                            ${genesisHash.substring(0,16)}...
                        </td>
                        <td><span class="status-tag status-valid">VALID</span></td>
                    `;
                } else {
                    const sensorData = b.data || {};
                    const isAlert = sensorData.status === 'Alert';

                    // FIXED: Read the new saved_hash value from the payload
                    const currentBlockHash = b.saved_hash || "N/A";

                    // Select correct CSS style for the live security review status column
                    let integrityTag = '';
                    if (b.integrity_status === 'CHAIN BROKEN') {
                        integrityTag = '<span class="status-tag status-broken">⚠️ CHAIN BROKEN</span>';
                    } else if (b.integrity_status === 'INVALID PARENT') {
                        integrityTag = '<span class="status-tag status-invalid">❌ INVALID PARENT</span>';
                    } else {
                        integrityTag = '<span class="status-tag status-valid">VALID</span>';
                    }

                    row.innerHTML = `
                        <td><strong>#${b.index}</strong></td>
                        <td style="color:#38bdf8; font-weight: 500;">${sensorData.sensor_id || 'N/A'}</td>
                        <td><i>${sensorData.type || 'N/A'}</i></td>
                        <td>${sensorData.value !== undefined ? sensorData.value : '0'}</td>
                        <td style="color:${isAlert ? '#ef4444' : '#22c55e'}; font-weight: bold;">
                            ${sensorData.status || 'Normal'}
                        </td>
                        <td style="color:${isAlert ? '#ef4444' : 'inherit'}">
                            ${sensorData.alert_id || 'N/A'}
                        </td>
                        <td style="font-family:monospace; font-size:0.75rem; color:#94a3b8" title="${currentBlockHash}">
                            ${currentBlockHash.substring(0,16)}...
                        </td>
                        <td>${integrityTag}</td>
                    `;
                }
                tbody.appendChild(row);
            });
        } catch (err) {
            console.error("Database or network server is offline.", err);
        }
    }
    </script>
