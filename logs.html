<!-- ==========================================================
SCRIPT SECTION (LOGIC + DATA FETCHING)
========================================================== -->

    <script>

    window.onload = () => {
        if (localStorage.getItem("logged") !== "true") {
            window.location.href = "/";
        } else {
            loadLogs();
        }
    };

    function logout() {
        localStorage.removeItem("logged");
        window.location.href = "/";
    }

/* ==========================================================
BLOCKCHAIN DATA FETCHING MODULE
==========================================================
Fetches ledger data from backend API (/chain)
and renders it into HTML table format.
========================================================== */

    async function loadLogs() {
        try {
            const res = await fetch("/chain");
            const data = await res.json();
            const tbody = document.querySelector("#logTable tbody");

            tbody.innerHTML = "";

            // OPTIMIZED: Reverse the array and take the top 50 newest records to keep the page snappy
            const optimizedChain = data.chain.reverse().slice(0, 50);

            data.chain.reverse().forEach(b => {
                const row = document.createElement('tr');

/* ==========================================================
GENESIS BLOCK HANDLING
========================================================== */

                if (b.index === 0) {
                    const genesisHash = b.hash || "B2282d6c00dc5a4319b71f71723c748d6bbc14fb1c3a10cf8fca25510051";
                    row.innerHTML = `
                        <td><strong>#${b.index}</strong></td>
                        <td colspan="5" style="text-align:center; color:#64748b; font-style: italic;">${b.data}</td>
                        <td style="font-family:monospace; font-size:0.75rem; color:#64748b" title="${genesisHash}">
                            ${genesisHash.substring(0,16)}...
                        </td>
                        <td><span class="status-tag status-valid">VALID</span></td>
                    `;
                } else {
                    const sensorData = b.data || {};
                    const isAlert = sensorData.status === 'Alert';

                    // FIXED: Read the new saved_hash value from the payload
                    const currentBlockHash = b.saved_hash || "N/A";

                    // Select correct CSS style for the live security review status column
                    let integrityTag = '';
                    if (b.integrity_status === 'CHAIN BROKEN') {
                        integrityTag = '<span class="status-tag status-broken">⚠️ CHAIN BROKEN</span>';
                    } else if (b.integrity_status === 'INVALID PARENT') {
                        integrityTag = '<span class="status-tag status-invalid">❌ INVALID PARENT</span>';
                    } else {
                        integrityTag = '<span class="status-tag status-valid">VALID</span>';
                    }

                    row.innerHTML = `
                        <td><strong>#${b.index}</strong></td>
                        <td style="color:#38bdf8; font-weight: 500;">${sensorData.sensor_id || 'N/A'}</td>
                        <td><i>${sensorData.type || 'N/A'}</i></td>
                        <td>${sensorData.value !== undefined ? sensorData.value : '0'}</td>
                        <td style="color:${isAlert ? '#ef4444' : '#22c55e'}; font-weight: bold;">
                            ${sensorData.status || 'Normal'}
                        </td>
                        <td style="color:${isAlert ? '#ef4444' : 'inherit'}">
                            ${sensorData.alert_id || 'N/A'}
                        </td>
                        <td style="font-family:monospace; font-size:0.75rem; color:#94a3b8" title="${currentBlockHash}">
                            ${currentBlockHash.substring(0,16)}...
                        </td>
                        <td>${integrityTag}</td>
                    `;
                }
                tbody.appendChild(row);
            });
        } catch (err) {
            console.error("Database or network server is offline.", err);
        }
    }

// ==========================================================
// BLOCKCHAIN SEARCH FUNCTION
// ==========================================================

function searchTable() {

    let input =
        document.getElementById("searchInput");

    let filter =
        input.value.toLowerCase();

    let rows =
        document.querySelectorAll("#logTable tbody tr");

    rows.forEach(row => {

        let text =
            row.innerText.toLowerCase();

        row.style.display =
            text.includes(filter) ? "" : "none";
    });
}

// ==========================================================
// BLOCKCHAIN STATUS FILTER
// ==========================================================

function filterStatus() {

    const filter =
        document.getElementById("statusFilter")
        .value
        .toLowerCase();

    const rows =
        document.querySelectorAll("#logTable tbody tr");

    rows.forEach(row => {

        const text =
            row.innerText.toLowerCase();

        if(filter === "all") {
            row.style.display = "";
        }
        else if(text.includes(filter)) {
            row.style.display = "";
        }
        else {
            row.style.display = "none";
        }
    });
}

// ==========================================================
// BLOCKCHAIN CSV EXPORT
// ==========================================================

function exportTable() {
    // 1. Fetch the data rows directly from the table body to capture what's loaded
    let rows = document.querySelectorAll("#logTable tbody tr");
    if (rows.length === 0) {
        alert("No data available to export.");
        return;
    }

    // 2. Define the exact CSV headers to match your system specs
    let csv = [["Block #", "Sensor ID", "Type", "Value", "Status", "Alert ID", "Hash", "Integrity"]];

    rows.forEach(row => {
        let cols = row.querySelectorAll("td");
        if (cols.length === 8) { // Normal block format
            let blockNum = cols[0].innerText.replace(/"/g, '""');
            let sensorId = cols[1].innerText.replace(/"/g, '""');
            let type     = cols[2].innerText.replace(/"/g, '""');
            let value    = cols[3].innerText.replace(/"/g, '""');
            let status   = cols[4].innerText.replace(/"/g, '""');
            let alertId  = cols[5].innerText.replace(/"/g, '""');

            // OPTIMIZED: Grab the full tracking hash from the hover 'title' attribute instead of the truncated '...' string!
            let fullHash = cols[6].getAttribute("title") || cols[6].innerText;
            fullHash     = fullHash.replace(/"/g, '""');

            let integrity = cols[7].innerText.replace(/"/g, '""');

            csv.push([
                `"${blockNum}"`,
                `"${sensorId}"`,
                `"${type}"`,
                `"${value}"`,
                `"${status}"`,
                `"${alertId}"`,
                `"${fullHash}"`,
                `"${integrity}"`
            ]);
        } else if (cols.length === 4) { // Handling for the Genesis block spacing format
            let blockNum = cols[0].innerText.replace(/"/g, '""');
            let genData  = cols[1].innerText.replace(/"/g, '""');
            let fullHash = cols[2].getAttribute("title") || cols[2].innerText;
            fullHash     = fullHash.replace(/"/g, '""');
            let integrity = cols[3].innerText.replace(/"/g, '""');

            csv.push([`"${blockNum}"`, '"N/A"', '"N/A"', '"0"', '"Normal"', `"${genData}"`, `"${fullHash}"`, `"${integrity}"`]);
        }
    });

    // 3. Generate file blob and auto-trigger download
    let csvString = csv.map(e => e.join(",")).join("\n");
    let csvFile = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
    let downloadLink = document.createElement("a");

    downloadLink.href = URL.createObjectURL(csvFile);
    downloadLink.download = "blockchain_campus_logs.csv";
    downloadLink.style.display = "none";

    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}
